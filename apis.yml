aid: imperfectfoods
name: Imperfect Foods
description: 'Imperfect Foods is a consumer grocery delivery service focused on reducing
  food waste. It sources surplus, cosmetically imperfect, and excess-inventory food
  — produce that is too large or small, packaging overstock, near best-by-date items,
  and manufacturing byproducts — and delivers them to members at a discount through
  a weekly, customizable grocery order of produce, meat, seafood, dairy, pantry staples,
  and snacks. Imperfect Foods was acquired by Misfits Market in 2022 and now operates
  as part of that company; its consumer web and mobile apps remain live. No public
  developer API, OpenAPI, or documentation surface was found during enrichment — this
  profile is maintained as a company identity record in the API Evangelist network.'
